<!-- NEW / EDIT ARTICLE MODAL (ADMIN) -->
<div id="modal-new-article" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 my-8 border border-slate-200 card-bg">
        <div class="flex justify-between items-center pb-4 border-b border-slate-200">
            <h2 id="modal-article-title-text" class="text-xl font-bold text-slate-900">Publicar Nova Matéria</h2>
            <button onclick="toggleModal('modal-new-article')" class="text-slate-400 hover:text-slate-600" aria-label="Fechar formulário">
                <i class="fa-solid fa-xmark text-xl" aria-hidden="true"></i>
            </button>
        </div>

        <form id="form-new-article" onsubmit="saveArticle(event)" class="mt-6 space-y-4">
            <!-- ID Oculto para controlo de edição -->
            <input type="hidden" id="art-id" value="">

            <div>
                <label for="art-title" class="block text-sm font-bold text-slate-800 mb-1">Título da Notícia *</label>
                <input type="text" id="art-title" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" placeholder="Ex: Novo software converte Libras em áudio em tempo real">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="art-category" class="block text-sm font-bold text-slate-800 mb-1">Categoria *</label>
                    <select id="art-category" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900">
                        <option value="visual">Deficiência Visual</option>
                        <option value="auditiva">Deficiência Auditiva</option>
                        <option value="motor">Mobilidade e Robótica</option>
                        <option value="software">Software e Inteligência Artificial</option>
                    </select>
                </div>
                <div>
                    <label for="art-author" class="block text-sm font-bold text-slate-800 mb-1">Autor / Jornalista *</label>
                    <input type="text" id="art-author" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" value="Redação TecAssistIn">
                </div>
            </div>

            <!-- CAMPO DE IMAGEM (URL) -->
            <div>
                <label for="art-image" class="block text-sm font-bold text-slate-800 mb-1">URL da Imagem de Capa *</label>
                <input type="url" id="art-image" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" placeholder="https://exemplo.com/imagem.jpg">
            </div>

            <div>
                <label for="art-image-alt" class="block text-sm font-bold text-slate-800 mb-1">Descrição Acessível da Imagem (Texto Alt) *</label>
                <input type="text" id="art-image-alt" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" placeholder="Descrição pormenorizada da imagem para leitores de ecrã">
            </div>

            <div>
                <label for="art-summary" class="block text-sm font-bold text-slate-800 mb-1">Resumo / Subtítulo *</label>
                <textarea id="art-summary" required rows="2" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" placeholder="Breve introdução que aparecerá nos cartões de notícias."></textarea>
            </div>

            <div>
                <label for="art-content" class="block text-sm font-bold text-slate-800 mb-1">Conteúdo da Notícia *</label>
                <textarea id="art-content" required rows="6" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-700 text-slate-900" placeholder="Escreva o artigo completo aqui..."></textarea>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                <button type="button" onclick="toggleModal('modal-new-article')" class="px-4 py-2 border border-slate-300 rounded-lg font-bold text-slate-700 hover:bg-slate-100">Cancelar</button>
                <button type="submit" id="btn-save-article" class="px-6 py-2 bg-brand-700 text-white rounded-lg font-bold hover:bg-brand-800 focus:ring-2 focus:ring-brand-700">Salvar Matéria</button>
            </div>
        </form>
    </div>
</div>
